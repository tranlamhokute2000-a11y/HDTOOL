<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem Trước Ống Gió</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#3b4453;font:13px "Segoe UI",sans-serif;color:#1d1d1f;padding:12px;display:flex}
.win{flex:1;display:flex;flex-direction:column;background:#f5f5f7;border-radius:10px;overflow:hidden;min-height:560px}
.bar{height:34px;background:#ececee;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid #d2d2d7;font-weight:700}
.bar i{width:12px;height:12px;border-radius:6px;background:#ff5f57}.bar i+i{background:#febc2e}.bar i+i+i{background:#28c840}.bar span{flex:1;text-align:center}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #e5e5ea;align-items:center}
button{font:600 12.5px "Segoe UI";border:1px solid #c7c7cc;border-radius:6px;background:#fff;padding:0 12px;height:30px;cursor:pointer}
button.p{background:#007aff;border-color:#007aff;color:#fff}button:disabled{opacity:.4;cursor:default}
label{display:flex;gap:5px;align-items:center;font-weight:600}
.leg{margin-left:auto;display:flex;gap:12px;font-size:12px;flex-wrap:wrap}.leg b{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px}
.main{flex:1;display:grid;grid-template-columns:1fr 290px;min-height:0}
.stage{position:relative;background:linear-gradient(#1a2340,#0b0f1c);min-height:340px}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
.hint{position:absolute;left:10px;bottom:8px;color:#9aa4bd;font-size:11.5px;pointer-events:none}
.side{display:flex;flex-direction:column;border-left:1px solid #d2d2d7;min-height:0;background:#f2f2f4}
.sum{padding:10px 12px;font-weight:700}.sum em{font-style:normal;color:#c62828;display:block}
.sel{margin:0 12px 8px;background:#fff;border:2px solid #007aff;border-radius:8px;padding:8px 10px;line-height:1.6;min-height:112px}
.sel button{margin-top:4px;width:100%}
.lh{padding:0 12px 4px;font-weight:700}
.list{flex:1;overflow:auto;background:#fff;margin:0 12px 10px;border:1px solid #c7c7cc;min-height:120px;max-height:100%}
.list div{padding:5px 8px;border-bottom:1px solid #eee;cursor:pointer;font-size:12px}.list div.on{background:#dcebff}.list div.off{text-decoration:line-through;color:#8e8e93}
.foot{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#ececee;border-top:1px solid #d2d2d7}
.foot span{flex:1;font-weight:700;color:#1e8e3e;font-size:12px}
@media(max-width:760px){body{display:block}.main{grid-template-columns:1fr}.stage{height:380px}.list{max-height:200px}}
</style>
</head>
